[package]
name = "shred-sniper"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3"
opentelemetry = { version = "0.32", features = ["logs", "metrics"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["logs", "metrics", "http-proto", "reqwest-blocking-client"] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["logs", "metrics"] }
reed-solomon-erasure = "6.0"
# Addresses are only ever looked up on the packet path, never inserted from the
# wire, so the DoS resistance SipHash buys is not needed there.
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for `flag::register`, which writes an `AtomicBool` from the handler and
# nothing else — the one thing that is safe to do in a signal context.
signal-hook = { version = "0.4", default-features = false }
solana-commitment-config = "3"
solana-connection-cache = "4.1"
solana-gossip = { version = "4.1", features = ["agave-unstable-api"] }
solana-hash = { version = "4", features = ["serde"] }
solana-keypair = "3.1"
solana-quic-client = "4.1"
solana-net-utils = "4.1"
solana-rpc-client = "4.1"
solana-rpc-client-api = "4.1"
solana-sha256-hasher = "3"
solana-signature = { version = "3", features = ["verify"] }
solana-signer = "3"
solana-streamer = { version = "4.1", features = ["agave-unstable-api"] }
solana-transaction = { version = "4.1", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Already in the tree through solana-gossip; used to shred real payloads and
# check our offsets against the format the leader actually produces.
solana-ledger = { version = "4.1", features = ["agave-unstable-api"] }
