[package]
name = "shred-sniper"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3"
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client"] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["metrics"] }
reed-solomon-erasure = "6.0"
serde = { version = "1", features = ["derive"] }
solana-gossip = { version = "4.1", features = ["agave-unstable-api"] }
solana-hash = { version = "4", features = ["serde"] }
solana-keypair = "3.1"
solana-net-utils = "4.1"
solana-signer = "3"
solana-streamer = { version = "4.1", features = ["agave-unstable-api"] }
solana-transaction = { version = "4.1", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Already in the tree through solana-gossip; used to shred real payloads and
# check our offsets against the format the leader actually produces.
solana-ledger = { version = "4.1", features = ["agave-unstable-api"] }
