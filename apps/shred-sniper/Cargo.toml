[package]
name = "shred-sniper"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
# agave-unstable-api открывает модули cluster_info/node/gossip_service.
solana-gossip = { version = "4.1", features = ["agave-unstable-api"] }
solana-hash = { version = "4", features = ["serde"] }
solana-keypair = "3.1"
solana-net-utils = "4.1"
solana-signer = "3"
solana-transaction = { version = "4.1", features = ["serde"] }
