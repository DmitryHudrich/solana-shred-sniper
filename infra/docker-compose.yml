name: solana-localnet

x-image: &image
  build:
    context: .
    dockerfile: docker/agave/dockerfile
    args:
      AGAVE_VERSION: v4.0.0
  image: solana-localnet-agave:v4.0.0

x-validator: &validator
  <<: *image
  restart: unless-stopped
  entrypoint: ["/bin/bash", "/scripts/validator.sh"]
  security_opt:
    - seccomp:unconfined
  volumes:
    - ./scripts:/scripts:ro
    - keys:/keys
    - genesis:/genesis
  depends_on:
    genesis:
      condition: service_completed_successfully
  ulimits:
    nofile:
      soft: 1000000
      hard: 1000000

services:
  genesis:
    <<: *image
    entrypoint: ["/bin/bash", "/scripts/genesis.sh"]
    environment:
      TARGET_TICK_DURATION_US: "15625"
      SLOTS_PER_EPOCH: "128"
    volumes:
      - ./scripts:/scripts:ro
      # genesis.sh downloads spl_memo.so itself; the volume only keeps it
      # between runs so a teardown does not mean fetching it again.
      - programs:/programs
      - keys:/keys
      - genesis:/genesis
    networks:
      solana:

  faucet:
    <<: *image
    restart: unless-stopped
    entrypoint: ["solana-faucet"]
    command: ["--keypair", "/keys/faucet.json"]
    volumes:
      - keys:/keys
    depends_on:
      genesis:
        condition: service_completed_successfully
    networks:
      solana:
        ipv4_address: 172.28.0.10

  validator1:
    <<: *validator
    environment:
      NODE_NAME: v1
      GOSSIP_HOST: 172.28.0.11
    volumes:
      - ./scripts:/scripts:ro
      - keys:/keys
      - genesis:/genesis
      - ledger1:/ledger
    ports:
      - "8899:8899"
    networks:
      solana:
        ipv4_address: 172.28.0.11

  validator2:
    <<: *validator
    environment:
      NODE_NAME: v2
      GOSSIP_HOST: 172.28.0.12
      ENTRYPOINT_ADDR: 172.28.0.11:8001
    volumes:
      - ./scripts:/scripts:ro
      - keys:/keys
      - genesis:/genesis
      - ledger2:/ledger
    ports:
      - "8898:8899"
    networks:
      solana:
        ipv4_address: 172.28.0.12

  validator3:
    <<: *validator
    environment:
      NODE_NAME: v3
      GOSSIP_HOST: 172.28.0.13
      ENTRYPOINT_ADDR: 172.28.0.11:8001
    volumes:
      - ./scripts:/scripts:ro
      - keys:/keys
      - genesis:/genesis
      - ledger3:/ledger
    ports:
      - "8897:8899"
    networks:
      solana:
        ipv4_address: 172.28.0.13

  transaction-bench:
    build:
      context: .
      dockerfile: docker/transaction-bench/dockerfile
      args:
        TPU_TOOLS_REF: ${TPU_TOOLS_REF:-9356451eb270954be6e8f4cefffcbb6a729a8d31}
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/scripts/transaction-bench.sh"]
    environment:
      RUST_LOG: ${BENCH_RUST_LOG:-info}
      RPC_URL: ${BENCH_RPC_URL:-http://172.28.0.11:8899}
      AUTHORITY: ${BENCH_AUTHORITY:-/keys/faucet.json}
      STAKED_IDENTITY_FILES: ${BENCH_STAKED_IDENTITY_FILES:-/keys/v1-identity.json}
      LEADER_TRACKER: ${BENCH_LEADER_TRACKER:-ws-leader-tracker}
      LEADER_TRACKER_ARGS: ${BENCH_LEADER_TRACKER_ARGS:-}
      NUM_PAYERS: ${BENCH_NUM_PAYERS:-256}
      PAYER_ACCOUNT_BALANCE: ${BENCH_PAYER_ACCOUNT_BALANCE:-1SOL}
      DURATION: ${BENCH_DURATION:-}
      TARGET_TPS: ${BENCH_TARGET_TPS:-130}
      TRANSFER_TX_CU_BUDGET: ${BENCH_TRANSFER_TX_CU_BUDGET:-600}
      NUM_SEND_INSTRUCTIONS_PER_TX: ${BENCH_NUM_SEND_INSTRUCTIONS_PER_TX:-1}
      MAX_LAMPORTS_TO_TRANSFER: ${BENCH_MAX_LAMPORTS_TO_TRANSFER:-65536}
      NUM_MAX_OPEN_CONNECTIONS: ${BENCH_NUM_MAX_OPEN_CONNECTIONS:-16}
      WORKERS_PULL_SIZE: ${BENCH_WORKERS_PULL_SIZE:-8}
      SEND_FANOUT: ${BENCH_SEND_FANOUT:-2}
      COMPUTE_UNIT_PRICE: ${BENCH_COMPUTE_UNIT_PRICE:-}
      RANDOM_COMPUTE_UNIT_PRICE_MAX: ${BENCH_RANDOM_COMPUTE_UNIT_PRICE_MAX:-}
      PRIORITY_FEE_SCHEDULE_PERIOD_MS: ${BENCH_PRIORITY_FEE_SCHEDULE_PERIOD_MS:-}
      TX_BATCH_SIZE: ${BENCH_TX_BATCH_SIZE:-}
      NUM_CONFLICT_GROUPS: ${BENCH_NUM_CONFLICT_GROUPS:-}
      VALIDATE_ACCOUNTS: ${BENCH_VALIDATE_ACCOUNTS:-false}
    volumes:
      - ./scripts:/scripts:ro
      - keys:/keys
    depends_on:
      validator1:
        condition: service_started
    networks:
      solana:
        ipv4_address: 172.28.0.30

  sniper:
    build:
      context: ..
      dockerfile: apps/shred-sniper/dockerfile
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-shred_sniper=info}
      ENTRYPOINT: ${ENTRYPOINT:-172.28.0.11:8001}
      # Unset here on purpose: the local cluster is torn down between runs, so
      # a fresh gossip identity costs nothing. Against a real cluster set this
      # to a mounted keypair, or every restart re-enters gossip from scratch and
      # receives nothing until it has propagated.
      NODE_KEYPAIR: ${NODE_KEYPAIR:-}
      ADVERTISE_IP: ${ADVERTISE_IP:-172.28.0.20}
      GOSSIP_PORT: ${GOSSIP_PORT:-8001}
      PORT_RANGE_MIN: ${PORT_RANGE_MIN:-8100}
      PORT_RANGE_MAX: ${PORT_RANGE_MAX:-8200}
      TVU_RECEIVE_SOCKETS: ${TVU_RECEIVE_SOCKETS:-4}
      TVU_RETRANSMIT_SOCKETS: ${TVU_RETRANSMIT_SOCKETS:-1}
      QUIC_ENDPOINTS: ${QUIC_ENDPOINTS:-1}
      CHECK_DUPLICATE_INSTANCE: ${CHECK_DUPLICATE_INSTANCE:-true}
      GOSSIP_STATS_INTERVAL_SECS: ${GOSSIP_STATS_INTERVAL_SECS:-5}
      SLOT_RETENTION: ${SLOT_RETENTION:-64}
      RPC_URL: ${RPC_URL:-http://172.28.0.11:8899}
      LEADER_SCHEDULE_ENABLED: ${LEADER_SCHEDULE_ENABLED:-true}
      SNIPE_PROGRAM: ${SNIPE_PROGRAM:-}
      SEARCHER_WALLETS: ${SEARCHER_WALLETS:-}
      TARGET_WALLETS: ${TARGET_WALLETS:-}
      # Who to watch, and what to answer with. Against a real cluster the
      # target is an address and nothing more; here both keys live in the repo,
      # so the file is the single place either wallet is defined and neither
      # pubkey has to be copied into a second one.
      TARGET_WALLET_FILES: ${TARGET_WALLET_FILES:-/wallets/wallet-a.json}
      SEARCHER_KEYPAIR: ${SEARCHER_KEYPAIR:-/wallets/wallet-b.json}
      MEMO_PROGRAM: ${MEMO_PROGRAM:-MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr}
      FIRE_VIA: ${FIRE_VIA:-tpu}
      TPU_FANOUT_SLOTS: ${TPU_FANOUT_SLOTS:-2}
      FIRE_MEMO: ${FIRE_MEMO:-sniped}
      FIRE_COOLDOWN_MS: ${FIRE_COOLDOWN_MS:-300}
      BLOCKHASH_REFRESH_MS: ${BLOCKHASH_REFRESH_MS:-400}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      LOGS_ENABLED: ${LOGS_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-shred-sniper}
      METRICS_EXPORT_INTERVAL_SECS: ${METRICS_EXPORT_INTERVAL_SECS:-5}
      METRICS_EXPORT_TIMEOUT_SECS: ${METRICS_EXPORT_TIMEOUT_SECS:-5}
    volumes:
      - ../wallet-a.json:/wallets/wallet-a.json:ro
      - ../wallet-b.json:/wallets/wallet-b.json:ro
    depends_on:
      validator1:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      solana:
        ipv4_address: 172.28.0.20

  wallet-a:
    <<: *image
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/scripts/wallet-a.sh"]
    environment:
      RPC_URL: ${WALLET_A_RPC_URL:-http://172.28.0.11:8899}
      INTERVAL: ${WALLET_A_INTERVAL:-5}
      AMOUNT: ${WALLET_A_AMOUNT:-0.000001}
    volumes:
      - ./scripts:/scripts:ro
      - ../wallet-a.json:/wallets/wallet-a.json:ro
      - ../wallet-b.json:/wallets/wallet-b.json:ro
    depends_on:
      validator1:
        condition: service_started
    networks:
      solana:
        ipv4_address: 172.28.0.21

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.1
    restart: unless-stopped
    command: ["--config", "/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"
      - "8889:8889"
    depends_on:
      loki:
        condition: service_started
    networks:
      solana:
        ipv4_address: 172.28.0.40

  loki:
    image: grafana/loki:3.7.4
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    ports:
      - "3100:3100"
    networks:
      solana:
        ipv4_address: 172.28.0.43

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=6h"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      solana:
        ipv4_address: 172.28.0.41

  grafana:
    image: grafana/grafana:12.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shred-sniper.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      solana:
        ipv4_address: 172.28.0.42

networks:
  solana:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  keys:
  genesis:
  programs:
  ledger1:
  ledger2:
  ledger3:
  prometheus:
  grafana:
  loki:
